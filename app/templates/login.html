<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>Entrar · GP-EndlessPix</title>
  <link rel="icon" type="image/png" href="/static/ui/gp-logo-256.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <main class="login-wrap">
    <section class="login-card">
      <div class="brand">
        <img class="brand-mark" src="/static/ui/gp-logo-256.png" alt="">
        <div>
          <p class="brand-name">GP-EndlessPix</p>
          <p class="brand-sub">envio para o Google Photos</p>
        </div>
      </div>

      <h1 class="login-title">Entrar</h1>
      <p class="login-sub">Acesso restrito · uso pessoal</p>

      <form method="post" action="/login" class="login-form">
        <label for="password">Senha de acesso</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          autofocus
          required
          placeholder="Digite a senha"
        >
        {% if error %}
        <p class="form-error" role="alert">{{ error }}</p>
        {% endif %}
        <button class="btn btn-primary btn-block" type="submit">Entrar</button>
      </form>
    </section>
  </main>
</body>
</html>
